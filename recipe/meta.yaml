{% set name = "gridtk" %}
{% set version = "4.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gridtk-{{ version }}.tar.gz
  sha256: ea08768b441e8fd1e2357adbf82f434de07fc2b7e6b6a6bc9ef708c4d180ca5d

build:
  entry_points:
    - gridtk = gridtk.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - sqlalchemy >=2.0,<3.dev0
    - tabulate >=0.9.0,<0.10.dev0
    - click >=8.1,<9.dev0

test:
  imports:
    - gridtk
  commands:
    - pip check
    - gridtk --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/gridtk/
  summary: 'GridTK: Slurm Job Management for Humans'
  doc_url: https://gridtk.readthedocs.io/
  dev_url: https://github.com/idiap/gridtk
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - anjos
    - 183amir
