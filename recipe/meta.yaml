{% set name = "gridtk" %}
{% set version = "3.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gridtk-{{ version }}.tar.gz
  sha256: 49a7c7696031ab0b6255d0a4fb6b3d25ff4ac018df73e2a5b6ae44d7e6fd8ff3

build:
  entry_points:
    - gridtk = gridtk.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - sqlalchemy >=2.0,<3.dev0
    - tabulate >=0.9.0,<0.10.dev0
    - click >=8.1,<9.dev0

test:
  imports:
    - gridtk
  commands:
    - pip check
    - gridtk --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/gridtk/
  summary: 'GridTK: Slurm Job Management for Humans'
  doc_url: https://gridtk.readthedocs.io/
  dev_url: https://github.com/idiap/gridtk
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - anjos
    - 183amir
